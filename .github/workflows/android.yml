name: Android CI

# Builds an installable debug APK and runs the unit tests on every push.
# The debug APK is auto-signed with the standard debug key, so it can be
# side-loaded onto any device straight from the uploaded artifact.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write # needed to publish the APK to a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 35 is present
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK (build artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MiniPlay-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # Publish the APK to a single, always-current "latest-debug" pre-release so
      # it has a stable one-tap download link (no zip). Only on the dev branch.
      - name: Publish APK to latest-debug release
        if: success() && github.ref == 'refs/heads/claude/gracious-pasteur-veq1g5'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Publishing $APK"
          # Recreate the release so the download URL stays constant.
          gh release delete latest-debug --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-debug "$APK" \
            --title "MiniPlay — latest debug APK" \
            --notes "Auto-built debug APK from ${{ github.sha }}. Install on Android (allow installs from unknown sources)." \
            --prerelease \
            --target "${{ github.sha }}"
